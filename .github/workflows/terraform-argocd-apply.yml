name: Terraform Argo CD Apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after plan"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: workspaces/argocd
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'ap-infra-prod' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'eu-west-2' }}
  TF_VAR_eks_cluster_name: ${{ vars.EKS_CLUSTER_NAME || 'ap-infra-prod' }}
  TF_VAR_zone: ${{ vars.ROUTE53_ZONE || 'mygreenpole.com' }}
  TF_VAR_argocd_hostname: ${{ vars.ARGOCD_HOSTNAME || 'argocd.mygreenpole.com' }}
  TF_VAR_github_account: ${{ vars.ARGOCD_GITHUB_ACCOUNT || 'Victory-Eze' }}
  TF_VAR_github_repository_url: ${{ vars.ARGOCD_GITHUB_REPOSITORY_URL || 'https://github.com/africa-prudential/greenpole-gitops.git' }}
  TF_VAR_github_revision: ${{ vars.ARGOCD_GITHUB_REVISION || 'main' }}
  TF_VAR_gitops_root_path: ${{ vars.ARGOCD_GITOPS_ROOT_PATH || 'prod' }}
  TF_VAR_ingress_certificate_arn: ${{ vars.ARGOCD_INGRESS_CERTIFICATE_ARN || 'arn:aws:acm:eu-west-2:825765408263:certificate/9a70b7b2-5213-4ac9-a0f5-9fa6ae868974' }}
  TF_VAR_github_pat_token: ${{ secrets.ARGOCD_GITHUB_PAT_TOKEN }}

jobs:
  terraform:
    name: Terraform
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required configuration
        shell: pwsh
        run: |
          Write-Host "Apply requested: ${{ github.event.inputs.apply }}"
          Write-Host "ARGOCD_GITHUB_REPOSITORY_URL: $env:TF_VAR_github_repository_url"
          Write-Host "ARGOCD_GITHUB_ACCOUNT: $env:TF_VAR_github_account"
          Write-Host "ARGOCD_GITHUB_REVISION: $env:TF_VAR_github_revision"
          Write-Host "ARGOCD_GITOPS_ROOT_PATH: $env:TF_VAR_gitops_root_path"

          $missing = @()
          if ([string]::IsNullOrWhiteSpace("${{ secrets.AWS_ROLE_TO_ASSUME }}")) { $missing += "secret AWS_ROLE_TO_ASSUME" }
          if ([string]::IsNullOrWhiteSpace($env:EKS_CLUSTER_NAME)) { $missing += "variable EKS_CLUSTER_NAME" }
          if ([string]::IsNullOrWhiteSpace($env:TF_VAR_zone)) { $missing += "variable ROUTE53_ZONE" }
          if ([string]::IsNullOrWhiteSpace($env:TF_VAR_github_account)) { $missing += "variable ARGOCD_GITHUB_ACCOUNT" }
          if ([string]::IsNullOrWhiteSpace($env:TF_VAR_github_repository_url)) { $missing += "variable ARGOCD_GITHUB_REPOSITORY_URL" }
          if ([string]::IsNullOrWhiteSpace($env:TF_VAR_github_revision)) { $missing += "variable ARGOCD_GITHUB_REVISION" }
          if ([string]::IsNullOrWhiteSpace($env:TF_VAR_gitops_root_path)) { $missing += "variable ARGOCD_GITOPS_ROOT_PATH" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.ARGOCD_GITHUB_PAT_TOKEN }}")) { $missing += "secret ARGOCD_GITHUB_PAT_TOKEN" }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions configuration: $($missing -join ', ')"
          }

          if ($env:TF_VAR_github_repository_url -match "/(tree|blob)/") {
            throw "ARGOCD_GITHUB_REPOSITORY_URL must be a repository clone URL, for example https://github.com/africa-prudential/greenpole-gitops.git. Current value: $env:TF_VAR_github_repository_url. Put the prod path in ARGOCD_GITOPS_ROOT_PATH."
          }
          if ($env:TF_VAR_github_account -match "^https?://" -or $env:TF_VAR_github_account -match "/") {
            throw "ARGOCD_GITHUB_ACCOUNT must be a GitHub username/account name only, not a URL. Current value: $env:TF_VAR_github_account."
          }

      - name: Configure AWS credentials from IAM role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        shell: pwsh
        run: |
          aws eks update-kubeconfig --region $env:AWS_REGION --name $env:EKS_CLUSTER_NAME

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          terraform plan -input=false -no-color -out=tfplan
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $plan = & terraform show -no-color tfplan
          Set-Content -Path tfplan.txt -Value $plan

      - name: Write plan summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          if (Test-Path tfplan.txt) {
            $plan = Get-Content -Path tfplan.txt -Raw
          } else {
            $plan = terraform show -no-color tfplan
          }
          $summary = @(
            "## Terraform plan"
            '```'
            $plan
            '```'
          ) -join [Environment]::NewLine
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Clean failed Argo CD Helm release
        if: ${{ github.event.inputs.apply == 'true' }}
        shell: pwsh
        run: |
          $statusJson = helm status argocd -n argocd -o json 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($statusJson)) {
            exit 0
          }

          $status = $statusJson | ConvertFrom-Json
          if ($status.info.status -in @("failed", "pending-install", "pending-upgrade", "pending-rollback")) {
            Write-Host "Uninstalling $($status.info.status) Argo CD Helm release"
            helm uninstall argocd -n argocd
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Terraform apply
        if: ${{ github.event.inputs.apply == 'true' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          terraform apply -input=false -no-color -auto-approve tfplan
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Apply skipped
        if: ${{ github.event.inputs.apply != 'true' }}
        run: echo "Terraform apply was skipped because workflow input apply was not true."
