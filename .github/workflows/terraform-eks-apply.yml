name: Terraform EKS Apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Run terraform apply after plan"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: workspaces/eks
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'ap-infra-prod' }}
  TF_VAR_eks_admin_principal_arns: '["${{ secrets.AWS_ROLE_TO_ASSUME }}"]'
  TF_VAR_github_runner_config_url: ${{ vars.GITHUB_RUNNER_CONFIG_URL || 'https://github.com/africa-prudential' }}
  TF_VAR_github_runner_token: ${{ secrets.EKS_GITHUB_RUNNER_TOKEN }}
  TF_VAR_github_runner_scale_set_name: ${{ vars.GITHUB_RUNNER_SCALE_SET_NAME || 'ap-infra-eks-runner' }}
  # TF_VAR_backstage_catalog_locations: ${{ vars.BACKSTAGE_CATALOG_LOCATIONS_JSON || '[]' }}

jobs:
  terraform:
    name: Terraform
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required configuration
        shell: pwsh
        run: |
          Write-Host "Apply requested: ${{ github.event.inputs.apply }}"
          $missing = @()
          if ([string]::IsNullOrWhiteSpace("${{ secrets.AWS_ROLE_TO_ASSUME }}")) { $missing += "secret AWS_ROLE_TO_ASSUME" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.EKS_GITHUB_RUNNER_TOKEN }}")) { $missing += "secret EKS_GITHUB_RUNNER_TOKEN" }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub Actions configuration: $($missing -join ', ')"
          }

      - name: Configure AWS credentials from IAM role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Configure kubeconfig if cluster already exists
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          aws eks update-kubeconfig --region $env:AWS_REGION --name $env:EKS_CLUSTER_NAME
        continue-on-error: true

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          $planArgs = @("plan", "-input=false", "-no-color", "-var-file=values.tfvars", "-out=tfplan")
          & terraform @planArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $showArgs = @("show", "-no-color", "tfplan")
          $plan = & terraform @showArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          Set-Content -Path tfplan.txt -Value $plan

      - name: Write plan summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          if (Test-Path tfplan.txt) {
            $plan = Get-Content -Path tfplan.txt -Raw
          } else {
            $showArgs = @("show", "-no-color", "tfplan")
            $plan = & terraform @showArgs
          }
          $summary = @(
            "## Terraform plan"
            '```'
            $plan
            '```'
          ) -join [Environment]::NewLine
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      # - name: Clean failed Helm releases
      #   if: ${{ github.event.inputs.apply == 'true' }}
      #   shell: pwsh
      #   run: |
      #     $releases = @(
      #       @{ Name = "aws-ebs-csi-driver"; Namespace = "kube-system" },
      #       @{ Name = "aws-load-balancer-controller"; Namespace = "kube-system" },
      #       @{ Name = "external-dns"; Namespace = "kube-system" },
      #       @{ Name = "external-secrets"; Namespace = "external-secrets" }
      #     )

      #     foreach ($release in $releases) {
      #       $statusJson = helm status $release.Name -n $release.Namespace -o json 2>$null
      #       if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($statusJson)) {
      #         continue
      #       }

      #       $status = $statusJson | ConvertFrom-Json
      #       if ($status.info.status -eq "failed") {
      #         Write-Host "Uninstalling failed Helm release $($release.Name) in namespace $($release.Namespace)"
      #         helm uninstall $release.Name -n $release.Namespace
      #         if ($LASTEXITCODE -ne 0) {
      #           exit $LASTEXITCODE
      #         }
      #       }
      #     }

      - name: Terraform apply
        if: ${{ github.event.inputs.apply == 'true' }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        shell: pwsh
        run: |
          $applyArgs = @("apply", "-input=false", "-no-color", "-auto-approve", "tfplan")
          & terraform @applyArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Apply skipped
        if: ${{ github.event.inputs.apply != 'true' }}
        run: echo "Terraform apply was skipped because workflow input apply was not true."
