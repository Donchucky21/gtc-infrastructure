apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: service-golden-path
  title: Service Golden Path
  description: Create a service repository with standard Backstage catalog metadata.
spec:
  owner: group:default/africa-prudential
  type: service

  parameters:
    - title: Service
      required:
        - name
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Repository and component name.
          pattern: "^[a-z0-9-]+$"
        owner:
          title: Owner
          type: string
          default: group:default/africa-prudential
        description:
          title: Description
          type: string

  steps:
    - id: fetch
      name: Fetch skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          description: ${{ parameters.description }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        repoUrl: github.com?owner=africa-prudential&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
